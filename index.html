<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REEF | Minecraft Portfolio</title>
<meta name="description" content="Reef's Minecraft-inspired portfolio world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#8b8b8b;--stone-light:#c6c6c6;--stone-dark:#555;--slot:#373737;
  --grass:#6fb43f;--dirt:#8b623e;--wood:#a56f2b;--xp:#7eff15;
  --gold:#fff16b;--cyan:#53d7ff;--text:#e8e1d4;--muted:#a9a194;
  --panel:rgba(0,0,0,.78);--panel-strong:rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'VT323',monospace;font-size:20px;color:var(--text);background:#09090d;overflow-x:hidden;cursor:crosshair}
a{color:inherit;text-decoration:none}
::selection{background:var(--xp);color:#000}
[hidden]{display:none!important}
::-webkit-scrollbar{width:14px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:var(--stone);border:3px solid #000}
::-webkit-scrollbar-thumb:hover{background:var(--stone-light)}

.mc-panorama{position:fixed;inset:0;z-index:-5;background:url('assets/mc-panorama.svg') center/cover no-repeat;filter:blur(8px) saturate(1.08) brightness(.82);transform:scale(1.04);animation:pan 28s ease-in-out infinite alternate}
.mc-panorama:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.38) 62%,rgba(0,0,0,.78))}
@keyframes pan{from{background-position:47% 50%}to{background-position:55% 50%}}
#panorama-bg-overlay{position:fixed;inset:0;z-index:-4;background-size:cover;background-position:center;opacity:0;transition:opacity 1s;pointer-events:none}
#panorama-bg-overlay.active{opacity:.35}

.particles{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.particle{position:absolute;width:4px;height:4px;background:var(--xp);box-shadow:0 0 7px rgba(126,255,21,.6);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(110vh);opacity:0}15%{opacity:.8}to{transform:translateY(-12vh);opacity:0}}

.mc-item{width:24px;height:24px;display:block;position:relative;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.45))}
.mc-item:before,.mc-item:after{content:"";position:absolute;inset:0}
.i-grass:before{background:linear-gradient(#7ecb48 0 28%,#8b623e 28%);box-shadow:inset 0 5px 0 #a2dd6c,inset 0 -5px 0 #65422c,inset -4px 0 0 rgba(0,0,0,.18)}
.i-book:before{background:#f4e2b7;box-shadow:inset 0 0 0 3px #78431e,inset 5px 0 0 #a2662f,inset -3px -3px 0 rgba(0,0,0,.18)}.i-book:after{inset:7px 5px 6px 9px;background:repeating-linear-gradient(#6b4628 0 2px,transparent 2px 5px)}
.i-sword:before{width:8px;height:20px;left:9px;top:0;background:#d7d7d7;box-shadow:3px 3px 0 #777;transform:rotate(45deg)}.i-sword:after{width:18px;height:5px;left:3px;top:15px;background:#6b4522;box-shadow:0 5px 0 #3a2412}
.i-chest:before{top:5px;height:16px;background:#a56f2b;box-shadow:inset 0 4px 0 #c79243,inset 0 -5px 0 #654019,inset 10px 0 0 #6b451d}.i-chest:after{inset:10px 8px 7px;background:#d3b461}
.i-players:before{width:10px;height:10px;left:2px;top:2px;background:#d6b08a;box-shadow:12px 2px 0 #c69570,0 11px 0 #4e8c46,12px 12px 0 #457cb4}
.i-sign:before{inset:3px 2px 8px;background:#b9853d;box-shadow:inset 0 3px 0 #d3a15a,inset 0 -3px 0 #6b431b}.i-sign:after{width:5px;height:8px;left:10px;bottom:1px;background:#6b431b}
.i-pick:before{width:20px;height:7px;left:2px;top:2px;background:#a4aaad;box-shadow:inset 0 -3px 0 #5b6062}.i-pick:after{width:5px;height:18px;left:10px;top:6px;background:#80522b;transform:rotate(38deg)}
.i-note:before{inset:3px 6px 6px 8px;background:#8d5cc2;box-shadow:inset 0 -4px 0 #5b3488}.i-note:after{width:12px;height:5px;left:7px;bottom:3px;background:#2f1f4d}
.i-map:before{inset:2px;background:#d0bc83;box-shadow:inset 0 0 0 3px #6d4c25}.i-map:after{inset:7px;background:linear-gradient(90deg,#578b48 0 40%,#2f68b7 40% 56%,#7aa452 56%)}
.i-star:before{left:9px;top:1px;width:6px;height:22px;background:var(--gold);box-shadow:-7px 7px 0 -1px var(--gold),7px 7px 0 -1px var(--gold)}.i-star:after{left:4px;top:9px;width:16px;height:6px;background:var(--gold)}
.i-fork:before{left:5px;top:3px;width:4px;height:18px;background:#cfcfcf;box-shadow:9px 0 0 #cfcfcf}.i-fork:after{left:5px;top:12px;width:13px;height:4px;background:#cfcfcf}

.hotbar{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:3px;padding:8px 10px 0;background:rgba(0,0,0,.74);border:3px solid #333;border-top:0}
.hotbar a{width:58px;height:58px;background:var(--slot);border:2px solid;border-color:#555 #ddd #ddd #555;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Press Start 2P',monospace;font-size:6px;color:#ddd;text-align:center;position:relative}
.hotbar a:hover,.hotbar a.active{background:#4a4a4a;color:var(--gold)}.hotbar a.active:after{content:"";position:absolute;left:7px;right:7px;bottom:-7px;height:4px;background:#fff;box-shadow:0 0 8px #fff}
.hotbar a:hover .mc-item,.hotbar a.active .mc-item{filter:drop-shadow(0 0 5px rgba(255,241,107,.85)) drop-shadow(2px 2px 0 rgba(0,0,0,.45))}

.mc-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;font-family:'Press Start 2P',monospace;font-size:8px;background:var(--stone);color:#eee;box-shadow:inset -3px -5px 0 var(--stone-dark),inset 3px 3px 0 var(--stone-light),0 4px 0 #222;cursor:pointer;border:0}
.mc-btn:hover{filter:brightness(1.22);color:var(--gold)}.mc-btn:active{transform:translateY(3px);box-shadow:inset 3px 5px 0 var(--stone-dark),inset -3px -3px 0 var(--stone-light),0 1px 0 #222}
.sound-btn{position:fixed;bottom:16px;right:16px;z-index:800;width:44px;height:44px;padding:0;font-size:18px;min-width:0}

main{position:relative;z-index:1}section{max-width:1160px;margin:0 auto;padding:92px 24px 72px;opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}.section-visible{opacity:1;transform:none}#home{opacity:1;transform:none}.hero{min-height:100vh;display:grid;align-items:center;padding-top:112px}.hero-grid{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:center}
.logo{font-family:'Press Start 2P',monospace;font-size:82px;line-height:.95;color:#fff;text-shadow:5px 5px 0 #3f3f3f,10px 10px 0 rgba(0,0,0,.32);letter-spacing:0}
.subtitle{font-size:30px;color:#d7d0c4;margin-top:14px}.tagline{font-size:24px;color:var(--gold);margin-top:6px}
.also-try{margin-top:10px;font-size:18px;color:#aaf;min-height:26px;animation:fade-cycle .9s steps(1) infinite}
@keyframes fade-cycle{0%,100%{opacity:1}50%{opacity:.6}}
.avatar{width:188px;height:188px;margin:auto;position:relative;border-radius:50%;background:radial-gradient(circle,#f3d99b 0 31%,#7d5829 32% 48%,#29180b 49%);box-shadow:0 0 0 4px #000,0 0 0 8px #6d4c28,0 16px 30px rgba(0,0,0,.35)}
.avatar img,.avatar .fallback{position:absolute;inset:18px;border-radius:50%;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:cover;border:4px solid #000;background:#785a38;display:grid;place-items:center;font-family:'Press Start 2P',monospace;font-size:34px}
.status{position:absolute;right:9px;bottom:9px;width:22px;height:22px;border:3px solid #000;background:#747f8d;border-radius:0}
.online{background:#43b581}.idle{background:#faa61a}.dnd{background:#f04747}.offline{background:#747f8d}
.xp-label{display:flex;justify-content:space-between;max-width:490px;margin:18px 0 6px;font-family:'Press Start 2P',monospace;font-size:6px;color:#aaa}
.xp-bar{height:10px;max-width:490px;background:#111;border:2px solid #000;overflow:hidden}.xp-fill{height:100%;width:78%;background:var(--xp);box-shadow:0 0 8px var(--xp);transition:width .5s}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px;margin-top:18px;max-width:620px}
.stat{background:var(--panel);border:3px solid var(--stone-dark);padding:14px;text-align:center}.stat b{display:block;font-family:'Press Start 2P',monospace;font-size:16px;color:var(--cyan)}.stat span{display:block;margin-top:7px;font-family:'Press Start 2P',monospace;font-size:6px;color:#999}
.title{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--gold);text-shadow:2px 2px 0 #3f3f00;margin-bottom:28px}.title:before{content:"[ ";color:#aaa}.title:after{content:" ]";color:#aaa}
.book{background:#c2a46f;border:4px solid #623c1b;box-shadow:5px 5px 0 #2b1907}.book-pages{display:grid;grid-template-columns:1fr 1fr}.page{position:relative;min-height:320px;padding:26px 22px;background:#f5e7c9;color:#2c1b08}.page:first-child{border-right:2px solid #a88458}.page:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 27px,rgba(101,63,29,.18) 27px 28px);pointer-events:none}.page h3{font-family:'Press Start 2P',monospace;font-size:9px;margin-bottom:14px;position:relative;z-index:1}.page p,.page li{position:relative;z-index:1;font-size:22px;line-height:1.35}.page ul{padding-left:18px;display:grid;gap:8px}
.book-socials{margin-top:18px;display:grid;gap:6px;position:relative;z-index:1}.book-sl{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(80,50,15,.12);border:1px solid rgba(80,50,15,.25);color:#3a1a00;font-size:18px;text-decoration:none}.book-sl:hover{background:rgba(80,50,15,.25)}
.panel{background:var(--panel);border:3px solid var(--stone-dark);box-shadow:3px 3px 0 rgba(0,0,0,.45);padding:18px}
.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px;background:#4d4d4d;padding:6px;border:4px solid #8b8b8b}.project{background:#3a3a3a;border:2px solid;border-color:#555 #e4e4e4 #e4e4e4 #555;padding:16px;display:flex;flex-direction:column;gap:8px}.project h3{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold)}.project p{font-size:18px;color:#d3d0c6}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.blog-post{background:rgba(0,0,0,.75);border:2px solid #555;padding:16px}.blog-post h3{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);margin-bottom:8px}.blog-post .date{font-family:'Press Start 2P',monospace;font-size:5px;color:#999;margin-bottom:10px}.blog-post p{font-size:20px;line-height:1.45}
.album-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.album-item{background:rgba(0,0,0,.75);border:2px solid #555;padding:8px;display:block}.album-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border:1px solid #333}.album-item .cap{font-family:'Press Start 2P',monospace;font-size:5px;color:#bbb;margin-top:6px}
.inventory{background:#c6c6c6;border:4px solid #555;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #555}.tabs{display:flex;flex-wrap:wrap;border-bottom:3px solid #555}.tab{padding:10px 14px;background:#8b8b8b;color:#222;border-right:2px solid #555;font-family:'Press Start 2P',monospace;font-size:6px;cursor:pointer;user-select:none}.tab.active{background:#c6c6c6;color:#000;margin-bottom:-3px;border-bottom:3px solid #c6c6c6}.inv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:3px;background:#555;padding:8px}.inv-item{min-height:92px;background:#8b8b8b;border:2px solid;border-color:#555 #dbdbdb #dbdbdb #555;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#111;text-align:center;overflow:hidden}.inv-item .label{font-family:'Press Start 2P',monospace;font-size:6px;line-height:1.5}
.badge-wall{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:rgba(0,0,0,.55);border:2px solid #777}.badge-link{width:88px;height:31px;display:block;border:1px solid #555;overflow:hidden;background:repeating-conic-gradient(#17102f 0 25%,#2c165b 0 50%) 0 0/8px 8px;image-rendering:pixelated;transition:transform .08s steps(1),filter .08s steps(1),border-color .08s steps(1)}.badge-link:hover{transform:translateY(-1px);filter:brightness(1.2);border-color:var(--gold)}.badge-link img,.badge-fallback{width:100%;height:100%;display:grid;place-items:center}.badge-link img{object-fit:cover;image-rendering:pixelated}.badge-fallback{font-family:'Press Start 2P',monospace;font-size:5px;color:#bbb}
.presence{margin-top:22px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:rgba(0,0,0,.84);border:3px solid #33208a;padding:16px;max-width:560px;box-shadow:0 0 20px rgba(50,0,150,.3)}.presence-avatar{width:70px;height:70px;border:3px solid #000;background:#333;display:grid;place-items:center;overflow:hidden}.presence-avatar img{width:100%;height:100%;object-fit:cover}.presence h3{font-family:'Press Start 2P',monospace;font-size:8px;margin-bottom:6px}.presence p{font-size:19px;color:#c8c0b4}.blog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.blog-post{background:rgba(0,0,0,.75);border:2px solid #555;padding:18px}.blog-post h3{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);margin-bottom:8px}.blog-post .date{font-family:'Press Start 2P',monospace;font-size:5px;color:#999;margin-bottom:10px}.blog-post p{font-size:20px;line-height:1.5}
.album-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.album-item{background:rgba(0,0,0,.75);border:2px solid #555;padding:8px;display:block;text-decoration:none}.album-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border:1px solid #333}.album-item .cap{font-family:'Press Start 2P',monospace;font-size:5px;color:#bbb;margin-top:6px;text-align:center}
.footer{text-align:center;padding:34px 24px 48px;background:rgba(0,0,0,.55);border-top:2px solid #333;font-family:'Press Start 2P',monospace;font-size:7px;color:#888}.footer .note{margin-top:10px;color:var(--gold)}
.tooltip{position:fixed;z-index:30;display:none;pointer-events:none;background:#100010;border:2px solid #2d0096;color:var(--gold);padding:8px 10px;font-size:18px;box-shadow:2px 2px 0 #000}
@media(max-width:900px){.hotbar{left:0;right:0;transform:none;justify-content:center;flex-wrap:wrap}.hero-grid,.book-pages{grid-template-columns:1fr}.hero{padding-top:150px}.logo{font-size:48px}.stats{grid-template-columns:1fr}.page:first-child{border-right:0;border-bottom:2px solid #a88458}}
</style>
</head>
<body>
<div class="mc-panorama" id="mc-panorama"></div>
<div id="panorama-bg-overlay"></div>
<div class="particles" id="particles"></div>
<div class="tooltip" id="tooltip"></div>
<button class="mc-btn sound-btn" id="sound-toggle" type="button">🔊</button>

</nav>
