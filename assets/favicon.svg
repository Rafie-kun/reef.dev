<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#09090d"/>
  <g transform="translate(32,34)">
    <!-- Top face (isometric) — grass green -->
    <polygon points="0,-20 18,-8 0,4 -18,-8" fill="#7ecb48" stroke="#5f9e34" stroke-width="1"/>
    <!-- Top face detail pixels -->
    <rect x="-4" y="-17" width="3" height="3" fill="#6bb83c" transform="rotate(-30)"/>
    <rect x="4" y="-15" width="2" height="2" fill="#a2dd6c" transform="rotate(-30)"/>
    <!-- Front-left face — brown dirt -->
    <polygon points="-18,-8 0,4 0,20 -18,8" fill="#8b623e" stroke="#6b4528" stroke-width="1"/>
    <!-- Front-left detail -->
    <rect x="-14" y="-2" width="3" height="3" fill="#7a5333"/>
    <rect x="-8" y="4" width="2" height="2" fill="#6b4528"/>
    <rect x="-14" y="10" width="3" height="2" fill="#7a5333"/>
    <!-- Front-right face — darker dirt -->
    <polygon points="0,4 18,-8 18,8 0,20" fill="#65422c" stroke="#4d2f1d" stroke-width="1"/>
    <!-- Front-right detail -->
    <rect x="4" y="0" width="3" height="3" fill="#7a5333"/>
    <rect x="10" y="4" width="2" height="2" fill="#4d2f1d"/>
    <!-- Grass top tufts (pixel style) -->
    <rect x="-2" y="-21" width="2" height="3" fill="#a2dd6c"/>
    <rect x="2" y="-22" width="2" height="2" fill="#7ecb48"/>
    <rect x="-6" y="-19" width="2" height="2" fill="#6bb83c"/>
    <rect x="6" y="-20" width="2" height="2" fill="#5f9e34"/>
  </g>
</svg>
