      <!-- Red Minecraft Wax Seal -->
      <rect x="7" y="7" width="2" height="2" fill="#bd1e1e"/>
      <rect x="6" y="8" width="4" height="2" fill="#bd1e1e"/>
      <rect x="7" y="10" width="2" height="1" fill="#8f1111"/>
