name: Deploy to Vercel

# Production deploys happen ONLY on push to main. Pull requests get a preview
# deploy (never --prod), and only for same-repo branches — fork PRs must not be
# able to trigger a deploy or reach repository secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# These are project identifiers, not secrets (they appear in Vercel URLs/settings).
env:
  VERCEL_ORG_ID: team_aGbUyEqYFuUEagHVyIPycCqP
  VERCEL_PROJECT_ID: prj_B10YfyycDPEnZRTm0V2eVVFrKb4o

jobs:
  production:
    # Only on direct pushes to main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  preview:
    # Preview deploy for pull requests from the same repository only (skip forks).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel (preview)
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
