<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="wolfSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="cherryTree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#wolfSky)"/>

  <!-- Pixelated Moon -->
  <rect x="950" y="60" width="80" height="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Mountains -->
  <polygon points="0,450 200,280 400,450" fill="#1e293b"/>
  <polygon points="250,480 500,220 750,480" fill="#0f172a"/>
  <polygon points="600,450 850,250 1100,450" fill="#1e293b"/>

  <!-- Mountain Snow Caps -->
  <polygon points="460,255 500,220 540,255" fill="#f8fafc"/>
  <polygon points="810,280 850,250 890,280" fill="#f8fafc"/>

  <!-- Cherry Trees & Spruce Forest -->
  <rect x="100" y="380" width="120" height="100" rx="10" fill="url(#cherryTree)"/>
  <rect x="150" y="480" width="20" height="80" fill="#451a03"/>

  <rect x="300" y="360" width="140" height="120" rx="10" fill="url(#cherryTree)"/>
  <rect x="360" y="480" width="24" height="90" fill="#451a03"/>

  <rect x="800" y="370" width="130" height="110" rx="10" fill="#15803d"/>
  <rect x="855" y="480" width="20" height="80" fill="#3f2305"/>

  <!-- Grass Ground -->
  <rect x="0" y="550" width="1200" height="125" fill="#15803d"/>
  <rect x="0" y="550" width="1200" height="15" fill="#86efac"/>

  <!-- Tamed Wolf Silhouette / Face in Center -->
  <g transform="translate(540, 420)">
    <!-- Ears -->
    <rect x="10" y="0" width="25" height="25" fill="#cbd5e1"/>
    <rect x="85" y="0" width="25" height="25" fill="#cbd5e1"/>
    <!-- Head -->
    <rect x="10" y="20" width="100" height="90" fill="#e2e8f0"/>
    <!-- Eyes -->
    <rect x="25" y="40" width="20" height="15" fill="#0f172a"/>
    <rect x="25" y="40" width="8" height="8" fill="#ffffff"/>
    <rect x="75" y="40" width="20" height="15" fill="#0f172a"/>
    <rect x="90" y="40" width="8" height="8" fill="#ffffff"/>
    <!-- Snout & Nose -->
    <rect x="40" y="55" width="40" height="40" fill="#f1f5f9"/>
    <rect x="48" y="55" width="24" height="18" fill="#1e293b"/>
    <!-- Red Collar -->
    <rect x="5" y="105" width="110" height="15" fill="#ef4444"/>
  </g>
</svg>
