<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <defs>
    <clipPath id="igbody">
      <!-- pixel-rounded square silhouette -->
      <path d="M5 1h6v1h2v1h1v2h1v6h-1v2h-1v1h-2v1H5v-1H3v-1H2V9H1V5h1V3h1V2h2z"/>
    </clipPath>
    <linearGradient id="iggs" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#833ab4"/>
      <stop offset=".38" stop-color="#e1306c"/>
      <stop offset=".72" stop-color="#fd5949"/>
      <stop offset="1" stop-color="#fcaf45"/>
    </linearGradient>
  </defs>
  <!-- soft drop shadow -->
  <path d="M5 2h6v1h2v1h1v2h1v5h-1v2h-1v1h-2v1H5v-1H3v-1H2v-2H1V6h1V4h1V3h2z" fill="#000000" opacity="0.55"/>
  <!-- gradient body clipped to silhouette -->
  <g clip-path="url(#igbody)">
    <rect x="1" y="1" width="14" height="14" fill="url(#iggs)"/>
    <!-- inner bevel -->
    <rect x="3" y="3" width="10" height="1" fill="#ffffff" opacity="0.22"/>
    <rect x="3" y="3" width="1" height="10" fill="#ffffff" opacity="0.16"/>
    <rect x="12" y="3" width="1" height="10" fill="#000000" opacity="0.18"/>
    <rect x="3" y="12" width="10" height="1" fill="#000000" opacity="0.22"/>
  </g>
  <!-- lens: white ring -->
  <rect x="5" y="5" width="6" height="6" fill="#ffffff"/>
  <rect x="6" y="4" width="4" height="8" fill="#ffffff"/>
  <rect x="4" y="6" width="8" height="4" fill="#ffffff"/>
  <!-- lens glass -->
  <rect x="6" y="5" width="4" height="1" fill="url(#iggs)" opacity="0"/>
  <rect x="6" y="6" width="4" height="4" fill="#1b0526"/>
  <!-- lens shine -->
  <rect x="6" y="6" width="2" height="1" fill="#ffffff" opacity="0.9"/>
  <rect x="6" y="7" width="1" height="1" fill="#ffffff" opacity="0.45"/>
  <!-- flash dot -->
  <rect x="11" y="4" width="2" height="2" fill="#ffffff"/>
</svg>
