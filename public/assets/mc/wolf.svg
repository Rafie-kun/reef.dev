<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <style>rect { image-rendering: pixelated; }</style>
  <!-- Background transparent -->
  <!-- Ears -->
  <rect x="2" y="1" width="3" height="3" fill="#d2ceca"/>
  <rect x="3" y="2" width="1" height="2" fill="#9e9892"/>
  <rect x="11" y="1" width="3" height="3" fill="#d2ceca"/>
  <rect x="12" y="2" width="1" height="2" fill="#9e9892"/>

  <!-- Head Base -->
  <rect x="2" y="4" width="12" height="11" fill="#c6c0ba"/>
  <rect x="2" y="4" width="12" height="2" fill="#dedad4"/>
  <!-- Forehead highlight -->
  <rect x="6" y="4" width="4" height="2" fill="#f0ece6"/>

  <!-- Eyes -->
  <rect x="3" y="6" width="3" height="2" fill="#1b1b1b"/>
  <rect x="3" y="6" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="6" width="3" height="2" fill="#1b1b1b"/>
  <rect x="12" y="6" width="1" height="1" fill="#ffffff"/>

  <!-- Muzzle / Nose Box -->
  <rect x="5" y="8" width="6" height="5" fill="#e8e2dc"/>
  <rect x="6" y="8" width="4" height="3" fill="#302a28"/> <!-- Black nose -->
  <rect x="5" y="11" width="6" height="2" fill="#584842"/> <!-- Mouth / Chops -->

  <!-- Red Collar underneath -->
  <rect x="1" y="14" width="14" height="2" fill="#cc1818"/>
  <rect x="3" y="14" width="10" height="2" fill="#ea2020"/>
</svg>
