<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 31" width="88" height="31">
  <defs>
    <style>
      .bg { fill: #20042b; }
      .border { fill: #48125c; }
      .inner-border { fill: #15021c; }
      .text-base { fill: #b832f0; font-family: 'Press Start 2P', monospace, monospace; font-size: 15px; font-weight: bold; }
      .text-glow { fill: #e880ff; }
      .text-shadow { fill: #12001a; }
      .sparkle { fill: #ffffff; }
      .hair-light { fill: #e0c8ff; }
      .hair-shadow { fill: #8a50b8; }
      .skin { fill: #fadae2; }
      .skin-shadow { fill: #d498aa; }
      .eye { fill: #2a003b; }
      .eye-iris { fill: #8b12b8; }
      .outfit { fill: #1c0026; }
      .outfit-trim { fill: #6a148a; }
    </style>
  </defs>

  <!-- Background and 88x31 Badge Outer Border -->
  <rect x="0" y="0" width="88" height="31" class="border"/>
  <rect x="1" y="1" width="86" height="29" class="bg"/>
  <rect x="2" y="2" width="84" height="27" fill="#280636"/>
  <rect x="1" y="1" width="86" height="1" fill="#682084"/>
  <rect x="1" y="1" width="1" height="29" fill="#682084"/>

  <!-- Pixel Grid Pattern background subtle -->
  <g opacity="0.15">
    <rect x="3" y="3" width="82" height="25" fill="none" stroke="#a030d0" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Text "RaFie" -->
  <!-- Shadow -->
  <text x="6" y="22" class="text-shadow" font-family="'Press Start 2P', monospace" font-size="14" font-weight="bold">RaFie</text>
  <text x="5" y="23" class="text-shadow" font-family="'Press Start 2P', monospace" font-size="14" font-weight="bold">RaFie</text>
  <!-- Base -->
  <text x="4" y="21" class="text-base" font-family="'Press Start 2P', monospace" font-size="14" font-weight="bold">RaFie</text>
  <text x="4" y="20" class="text-glow" font-family="'Press Start 2P', monospace" font-size="14" font-weight="bold" opacity="0.7">RaFie</text>

  <!-- Sparkles ✨ above 'Fie' -->
  <path d="M 46 5 L 48 5 L 48 3 L 49 3 L 49 5 L 51 5 L 51 6 L 49 6 L 49 8 L 48 8 L 48 6 L 46 6 Z" class="sparkle"/>
  <path d="M 52 10 L 53 10 L 53 9 L 54 9 L 54 10 L 55 10 L 55 11 L 54 11 L 54 12 L 53 12 L 53 11 L 52 11 Z" fill="#e0c0ff"/>

  <!-- Character Artwork (Anime Girl Pixel Art on Right Side) -->
  <!-- Dark Vignette behind character -->
  <rect x="52" y="2" width="34" height="27" fill="#180221" opacity="0.6"/>

  <!-- Character Hair Back -->
  <rect x="66" y="3" width="18" height="24" fill="#320645"/>

  <!-- Body / Shoulders / Outfit -->
  <path d="M 58 20 L 86 20 L 86 29 L 58 29 Z" class="outfit"/>
  <!-- Skin Chest / Neck -->
  <path d="M 64 16 L 78 16 L 80 23 L 66 25 Z" class="skin"/>
  <path d="M 70 20 L 74 20 L 72 24 Z" class="skin-shadow"/> <!-- Cleavage detail -->
  <path d="M 68 18 L 76 18 L 76 19 L 68 19 Z" fill="#0d0012"/> <!-- Black Choker -->
  <circle cx="72" cy="18.5" r="0.8" fill="#e0e0e0"/> <!-- Choker charm -->

  <!-- Face Base -->
  <path d="M 66 7 L 82 7 L 82 17 L 78 19 L 70 19 L 66 16 Z" class="skin"/>
  <!-- Blush -->
  <rect x="67" y="14" width="3" height="1.5" fill="#e88298" opacity="0.6"/>
  <rect x="77" y="14" width="3" height="1.5" fill="#e88298" opacity="0.6"/>

  <!-- Eyes (Anime Style Purple Eyes) -->
  <rect x="68" y="11" width="4" height="4" class="eye"/>
  <rect x="69" y="12" width="2" height="3" class="eye-iris"/>
  <rect x="69" y="11.5" width="1" height="1" fill="#ffffff"/> <!-- Eye shine -->

  <rect x="76" y="11" width="4" height="4" class="eye"/>
  <rect x="77" y="12" width="2" height="3" class="eye-iris"/>
  <rect x="77" y="11.5" width="1" height="1" fill="#ffffff"/> <!-- Eye shine -->

  <!-- Eyebrows / Eyelashes -->
  <rect x="67" y="10" width="5" height="1" fill="#20002b"/>
  <rect x="75" y="10" width="5" height="1" fill="#20002b"/>

  <!-- Hair Front Bangs / Locks (Lavender/White) -->
  <path d="M 64 3 L 84 3 L 85 8 L 81 12 L 78 8 L 75 12 L 72 7 L 68 12 L 65 8 Z" class="hair-light"/>
  <!-- Hair Highlights & Shadows -->
  <path d="M 65 3 L 83 3 L 82 5 L 66 5 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 64 8 L 66 14 L 68 10 Z" class="hair-shadow"/>
  <path d="M 80 8 L 84 14 L 82 10 Z" class="hair-shadow"/>

  <!-- Side framing vignette -->
  <rect x="85" y="2" width="1" height="27" fill="#48125c"/>
</svg>